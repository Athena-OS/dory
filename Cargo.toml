[workspace]

members = [
    "dory",
    "core",
    "shared",
]

resolver = "2"

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1"

# The installer ships on a live ISO: optimise for size and strip symbols.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
strip = true
